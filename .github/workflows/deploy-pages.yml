name: Deploy to GitHub Pages

# Publishes the site. In repo Settings → Pages, set Source = "GitHub Actions".
on:
  push:
    branches: ["main", "claude/world-cup-results-site-nruo2z"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."          # the whole repo root is the static site
      - id: deployment
        uses: actions/deploy-pages@v4
