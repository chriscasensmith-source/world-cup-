name: Update World Cup results

# Auto-fetches live results into data/matches.json and commits any changes.
# Add a free token as repo secret FOOTBALL_DATA_API_TOKEN to enable.
on:
  schedule:
    # GitHub throttles scheduled runs under load, so request frequently
    # (every 5 min) to maximize the odds a run fires close to schedule.
    - cron: "*/5 * * * *"
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch results
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: node scripts/fetch-results.mjs

      - name: Commit results
        run: |
          git config user.name "wc26-bot"
          git config user.email "actions@github.com"
          git add data/matches.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync World Cup results"
            git push
          else
            echo "No changes to commit."
          fi
