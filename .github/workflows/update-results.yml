name: Update World Cup results

# Continuously polls football-data.org and commits any score changes to
# data/matches.json. Instead of relying on GitHub's unreliable schedule (which
# can lag 1-2 hours), each run loops internally — polling every ~90 seconds for
# ~5.5 hours — so results stay fresh to within a couple of minutes. The schedule
# just restarts the poller if it ever stops. Free on public repos.
on:
  schedule:
    - cron: "0 */4 * * *"      # safety net: restart the poller if it isn't running
  workflow_dispatch:           # run manually from the Actions tab

permissions:
  contents: write

# Only one poller at a time. cancel-in-progress: true means a manual trigger
# (or the 4h schedule) immediately replaces the running poller — so "Run workflow"
# always works instead of being queued and silently cancelled.
concurrency:
  group: update-results
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340       # ~5.7h, safely under the 6h hard limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll and commit results every ~90s
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          git config user.name "wc26-bot"
          git config user.email "actions@github.com"
          # Stop ~20 min before the job timeout so the loop exits cleanly.
          end=$(( $(date +%s) + 19200 ))   # 5h20m of polling
          while [ "$(date +%s)" -lt "$end" ]; do
            node scripts/fetch-results.mjs || true
            git add data/matches.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: sync World Cup results"
              # Re-sync in case main moved (e.g. a code push) before pushing.
              git pull --rebase --autostash origin main || true
              git push || echo "push failed, will retry next loop"
            fi
            sleep 90
          done
